<script type="module">

import { initializeApp }
  from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
  getDatabase,
  ref,
  get,
  update
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {
  apiKey: "AIzaSyBr-z5-7I8_WEy-XuQX8Z5dXa9XtCxXba0",
  authDomain: "nexora-adef3.firebaseapp.com",
  projectId: "nexora-adef3",
  storageBucket: "nexora-adef3.firebasestorage.app",
  messagingSenderId: "318277373899",
  appId: "1:318277373899:web:0d2f97b1fa99cc7702304e",
  measurementId: "G-WN2V48SC4T"
};


/* =========================
   ADMIN UID
========================= */

const ADMIN_UID = "6wsARRpgWwaez7qg86fjCNS4SY13";


/* =========================
   FIREBASE INIT
========================= */

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);


/* =========================
   HELPERS
========================= */

const $ = id => document.getElementById(id);


function escapeHTML(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


function money(value) {
  return `$${Number(value || 0).toFixed(2)}`;
}


function formatDate(value) {

  if (!value) return "-";

  const d = new Date(Number(value));

  if (Number.isNaN(d.getTime())) {
    return "-";
  }

  return d.toLocaleString();
}


function statusBadge(value) {

  const s =
    String(value || "pending").toLowerCase();

  return `
    <span class="status ${escapeHTML(s)}">
      ${escapeHTML(s.toUpperCase())}
    </span>
  `;
}


function showNotice(message, error = false) {

  const notice = $("notice");

  if (!notice) return;

  notice.textContent = message;

  notice.className =
    error
      ? "notice error"
      : "notice";
}


/* =========================
   DATABASE READ
========================= */

async function readPath(path) {

  const snapshot =
    await get(ref(db, path));

  return snapshot.exists()
    ? snapshot.val()
    : {};
}


/* =========================
   AUTH + ADMIN CHECK
========================= */

onAuthStateChanged(auth, async (user) => {

  /*
     Firebase pehle auth state restore karta hai.
     Isliye bina verification ke logout/redirect nahi karenge.
  */

  if (!user) {

    showNotice(
      "No active login session. Please login again.",
      true
    );

    setTimeout(() => {
      location.href = "login.html";
    }, 2000);

    return;
  }


  $("adminEmail").textContent =
    user.email || "Admin";


  /*
     IMPORTANT:
     Apne main admin UID ko direct verify kar rahe hain.
     Isse admins/{uid} read check ki wajah se
     unnecessary redirect nahi hoga.
  */

  if (user.uid === ADMIN_UID) {

    showNotice(
      "Admin verified. Loading dashboard..."
    );

    try {

      await loadDashboard();

    }

    catch (error) {

      console.error(
        "Dashboard loading error:",
        error
      );

      showNotice(
        `Firebase Error: ${error.code || ""} ${error.message || error}`,
        true
      );

    }

    return;
  }


  /*
     Agar future mein doosra admin add karna ho
     to admins/{uid} bhi check hoga.
  */

  try {

    showNotice(
      "Checking admin permission..."
    );


    const adminSnapshot =
      await get(
        ref(db, `admins/${user.uid}`)
      );


    const adminValue =
      adminSnapshot.exists()
        ? adminSnapshot.val()
        : false;


    const isAdmin =
      adminValue === true ||
      adminValue === "true";


    if (!isAdmin) {

      showNotice(
        "Access denied. This account is not an admin.",
        true
      );

      setTimeout(() => {
        location.href = "login.html";
      }, 2000);

      return;
    }


    showNotice(
      "Admin verified. Loading dashboard..."
    );


    await loadDashboard();

  }

  catch (error) {

    console.error(
      "Admin verification error:",
      error
    );

    showNotice(
      `Admin verification error: ${error.code || ""} ${error.message || error}`,
      true
    );

  }

});


/* =========================
   LOAD DASHBOARD
========================= */

async function loadDashboard() {

  const usersData =
    await readPath("users");

  const depositsData =
    await readPath("deposits");

  const withdrawalsData =
    await readPath("withdrawals");


  /* =========================
     USERS
  ========================= */

  const users =
    Object.entries(usersData || {})
      .map(([uid, user]) => ({
        uid,
        ...(user || {})
      }));


  $("usersCount").textContent =
    users.length;


  const totalWallet =
    users.reduce(
      (sum, user) =>
        sum + Number(user.wallet || 0),
      0
    );


  $("totalWallet").textContent =
    money(totalWallet);


  if (!users.length) {

    $("usersTable").innerHTML = `
      <tr>
        <td colspan="7" class="empty">
          No users found.
        </td>
      </tr>
    `;

  } else {

    $("usersTable").innerHTML =
      users.map(user => `

        <tr>

          <td>
            ${escapeHTML(user.name || "-")}
          </td>

          <td>
            ${escapeHTML(user.email || "-")}
          </td>

          <td>
            ${escapeHTML(user.referralCode || "-")}
          </td>

          <td>
            ${money(user.wallet)}
          </td>

          <td>
            ${money(user.totalDeposit)}
          </td>

          <td>
            ${money(user.totalWithdrawal)}
          </td>

          <td>
            ${
              user.active === false
                ? "Inactive"
                : "Active"
            }
          </td>

        </tr>

      `).join("");

  }


  /* =========================
     DEPOSITS
  ========================= */

  const deposits =
    Object.entries(depositsData || {})
      .map(([id, deposit]) => ({
        id,
        ...(deposit || {})
      }));


  deposits.sort(
    (a, b) =>
      Number(b.createdAt || 0) -
      Number(a.createdAt || 0)
  );


  const pendingDeposits =
    deposits.filter(
      item =>
        String(item.status || "pending")
          .toLowerCase() === "pending"
    );


  $("pendingDeposits").textContent =
    pendingDeposits.length;


  if (!deposits.length) {

    $("depositsTable").innerHTML = `
      <tr>
        <td colspan="7" class="empty">
          No deposit requests.
        </td>
      </tr>
    `;

  } else {

    $("depositsTable").innerHTML =
      deposits.map(deposit => {

        const isPending =
          String(deposit.status || "pending")
            .toLowerCase() === "pending";


        return `

          <tr>

            <td>
              ${escapeHTML(
                formatDate(deposit.createdAt)
              )}
            </td>

            <td>

              <div>
                ${escapeHTML(
                  deposit.email || "-"
                )}
              </div>

              <div class="id-text">
                UID:
                ${escapeHTML(
                  deposit.uid || "-"
                )}
              </div>

            </td>

            <td>
              ${money(deposit.amountUSDT)}
            </td>

            <td>
              ${escapeHTML(
                deposit.method || "-"
              )}
            </td>

            <td>

              <span class="id-text">
                ${escapeHTML(
                  deposit.transactionId || "-"
                )}
              </span>

            </td>

            <td>
              ${statusBadge(
                deposit.status
              )}
            </td>

            <td>

              ${
                isPending
                  ? `

                    <button
                      class="approve"
                      data-approve-deposit="${escapeHTML(deposit.id)}"
                    >
                      Approve
                    </button>

                    <button
                      class="reject"
                      data-reject-deposit="${escapeHTML(deposit.id)}"
                    >
                      Reject
                    </button>

                  `
                  : "-"
              }

            </td>

          </tr>

        `;

      }).join("");

  }


  /* =========================
     WITHDRAWALS
  ========================= */

  const withdrawals =
    Object.entries(withdrawalsData || {})
      .map(([id, withdrawal]) => ({
        id,
        ...(withdrawal || {})
      }));


  withdrawals.sort(
    (a, b) =>
      Number(b.createdAt || 0) -
      Number(a.createdAt || 0)
  );


  const pendingWithdrawals =
    withdrawals.filter(
      item =>
        String(item.status || "pending")
          .toLowerCase() === "pending"
    );


  $("pendingWithdrawals").textContent =
    pendingWithdrawals.length;


  if (!withdrawals.length) {

    $("withdrawalsTable").innerHTML = `
      <tr>
        <td colspan="7" class="empty">
          No withdrawal requests.
        </td>
      </tr>
    `;

  } else {

    $("withdrawalsTable").innerHTML =
      withdrawals.map(withdrawal => {

        const isPending =
          String(withdrawal.status || "pending")
            .toLowerCase() === "pending";


        return `

          <tr>

            <td>
              ${escapeHTML(
                formatDate(
                  withdrawal.createdAt
                )
              )}
            </td>

            <td>

              <div>
                ${escapeHTML(
                  withdrawal.email || "-"
                )}
              </div>

              <div class="id-text">
                UID:
                ${escapeHTML(
                  withdrawal.uid || "-"
                )}
              </div>

            </td>

            <td>
              ${money(
                withdrawal.amountUSDT ??
                withdrawal.amount
              )}
            </td>

            <td>
              ${escapeHTML(
                withdrawal.method || "-"
              )}
            </td>

            <td>
              ${escapeHTML(
                withdrawal.accountNumber ||
                withdrawal.account ||
                "-"
              )}
            </td>

            <td>
              ${statusBadge(
                withdrawal.status
              )}
            </td>

            <td>

              ${
                isPending
                  ? `

                    <button
                      class="approve"
                      data-approve-withdrawal="${escapeHTML(withdrawal.id)}"
                    >
                      Approve
                    </button>

                    <button
                      class="reject"
                      data-reject-withdrawal="${escapeHTML(withdrawal.id)}"
                    >
                      Reject
                    </button>

                  `
                  : "-"
              }

            </td>

          </tr>

        `;

      }).join("");

  }


  showNotice(
    "Dashboard loaded successfully."
  );

}


/* =========================
   DEPOSIT ACTIONS
========================= */

$("depositsTable").addEventListener(
  "click",
  async (event) => {

    const approveButton =
      event.target.closest(
        "[data-approve-deposit]"
      );


    const rejectButton =
      event.target.closest(
        "[data-reject-deposit]"
      );


    if (approveButton) {

      await approveDeposit(
        approveButton.dataset.approveDeposit
      );

      return;
    }


    if (rejectButton) {

      await rejectDeposit(
        rejectButton.dataset.rejectDeposit
      );

    }

  }
);


async function approveDeposit(id) {

  if (!confirm(
    "Approve this deposit?"
  )) {
    return;
  }


  try {

    showNotice(
      "Approving deposit..."
    );


    const depositRef =
      ref(db, `deposits/${id}`);


    const depositSnapshot =
      await get(depositRef);


    if (!depositSnapshot.exists()) {
      throw new Error(
        "Deposit not found."
      );
    }


    const deposit =
      depositSnapshot.val();


    if (
      String(
        deposit.status || "pending"
      ).toLowerCase() !== "pending"
    ) {

      throw new Error(
        "This deposit is already processed."
      );

    }


    const uid =
      deposit.uid;


    if (!uid) {
      throw new Error(
        "Deposit UID is missing."
      );
    }


    const userSnapshot =
      await get(
        ref(db, `users/${uid}`)
      );


    if (!userSnapshot.exists()) {
      throw new Error(
        "User profile not found."
      );
    }


    const user =
      userSnapshot.val();


    const depositAmount =
      Number(
        deposit.amountUSDT || 0
      );


    if (
      !Number.isFinite(depositAmount) ||
      depositAmount <= 0
    ) {

      throw new Error(
        "Invalid deposit amount."
      );

    }


    await update(
      ref(db),
      {

        [`deposits/${id}/status`]:
          "approved",

        [`deposits/${id}/approvedAt`]:
          Date.now(),

        [`users/${uid}/wallet`]:
          Number(user.wallet || 0) +
          depositAmount,

        [`users/${uid}/totalDeposit`]:
          Number(user.totalDeposit || 0) +
          depositAmount

      }
    );


    alert(
      "Deposit approved successfully."
    );


    await loadDashboard();

  }

  catch (error) {

    console.error(
      "Approve deposit error:",
      error
    );


    showNotice(
      `Deposit Error: ${error.code || ""} ${error.message || error}`,
      true
    );

  }

}


async function rejectDeposit(id) {

  if (!confirm(
    "Reject this deposit?"
  )) {
    return;
  }


  try {

    showNotice(
      "Rejecting deposit..."
    );


    const depositRef =
      ref(db, `deposits/${id}`);


    const snapshot =
      await get(depositRef);


    if (!snapshot.exists()) {
      throw new Error(
        "Deposit not found."
      );
    }


    const deposit =
      snapshot.val();


    if (
      String(
        deposit.status || "pending"
      ).toLowerCase() !== "pending"
    ) {

      throw new Error(
        "This deposit is already processed."
      );

    }


    await update(
      ref(db),
      {

        [`deposits/${id}/status`]:
          "rejected",

        [`deposits/${id}/rejectedAt`]:
          Date.now()

      }
    );


    alert(
      "Deposit rejected."
    );


    await loadDashboard();

  }

  catch (error) {

    console.error(
      "Reject deposit error:",
      error
    );


    showNotice(
      `Reject Error: ${error.code || ""} ${error.message || error}`,
      true
    );

  }

}

/* =========================
   LOGOUT BUTTON
========================= */

$("logoutBtn").addEventListener(
  "click",
  async () => {

    try {

      await signOut(auth);

      location.href =
        "login.html";

    }

    catch (error) {

      showNotice(
        `Logout Error: ${error.message}`,
        true

  }
);

</script>

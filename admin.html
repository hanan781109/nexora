========================= */

/* =========================
   HELPERS
========================= */

const $ = (id) => document.getElementById(id);


function escapeHTML(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


function money(value) {
  return `$${Number(value || 0).toFixed(2)}`;
}


function formatDate(value) {

  if (!value) return "-";

  const d = new Date(Number(value));

  if (Number.isNaN(d.getTime())) {
    return "-";
  }

  return d.toLocaleString();
}


function statusBadge(value) {

  const s = String(value || "pending").toLowerCase();

  return `
    <span class="status ${escapeHTML(s)}">
      ${escapeHTML(s.toUpperCase())}
    </span>
  `;
}


function showNotice(message, error = false) {

  const notice = $("notice");

  if (!notice) {
    console.log(message);
    return;
  }

  notice.textContent = message;

  notice.className = error
    ? "notice error"
    : "notice";
}


function setText(id, value) {

  const element = $(id);

  if (element) {
    element.textContent = value;
  }
}


/* =========================
   DATABASE READ
========================= */

async function readPath(path) {

  const snapshot = await get(ref(db, path));

  return snapshot.exists()
    ? snapshot.val()
    : {};
}


/* =========================
   LOAD DASHBOARD
========================= */

async function loadDashboard() {

  try {

    showNotice("Loading dashboard...");


    const usersData =
      await readPath("users");

    const depositsData =
      await readPath("deposits");

    const withdrawalsData =
      await readPath("withdrawals");


    /* =========================
       USERS
    ========================= */

    const users =
      Object.entries(usersData || {})
        .map(([uid, user]) => ({
          uid,
          ...(user || {})
        }));


    setText(
      "usersCount",
      users.length
    );


    const totalWallet =
      users.reduce(
        (sum, user) =>
          sum + Number(user.wallet || 0),
        0
      );


    setText(
      "totalWallet",
      money(totalWallet)
    );


    const usersTable =
      $("usersTable");


    if (usersTable) {

      if (!users.length) {

        usersTable.innerHTML = `
          <tr>
            <td colspan="7" class="empty">
              No users found.
            </td>
          </tr>
        `;

      } else {

        usersTable.innerHTML =
          users.map(user => `

            <tr>

              <td>
                ${escapeHTML(user.name || "-")}
              </td>

              <td>
                ${escapeHTML(user.email || "-")}
              </td>

              <td>
                ${escapeHTML(user.referralCode || "-")}
              </td>

              <td>
                ${money(user.wallet)}
              </td>

              <td>
                ${money(user.totalDeposit)}
              </td>

              <td>
                ${money(user.totalWithdrawal)}
              </td>

              <td>
                ${
                  user.active === false
                    ? "Inactive"
                    : "Active"
                }
              </td>

            </tr>

          `).join("");

      }

    }


    /* =========================
       DEPOSITS
    ========================= */

    const deposits =
      Object.entries(depositsData || {})
        .map(([id, deposit]) => ({
          id,
          ...(deposit || {})
        }));


    deposits.sort(
      (a, b) =>
        Number(b.createdAt || 0) -
        Number(a.createdAt || 0)
    );


    const pendingDeposits =
      deposits.filter(
        item =>
          String(item.status || "pending")
            .toLowerCase() === "pending"
      );


    setText(
      "pendingDeposits",
      pendingDeposits.length
    );


    const depositsTable =
      $("depositsTable");


    if (depositsTable) {

      if (!deposits.length) {

        depositsTable.innerHTML = `
          <tr>
            <td colspan="7" class="empty">
              No deposit requests.
            </td>
          </tr>
        `;

      } else {

        depositsTable.innerHTML =
          deposits.map(deposit => {

            const isPending =
              String(deposit.status || "pending")
                .toLowerCase() === "pending";


            return `

              <tr>

                <td>
                  ${escapeHTML(
                    formatDate(deposit.createdAt)
                  )}
                </td>

                <td>

                  <div>
                    ${escapeHTML(
                      deposit.email || "-"
                    )}
                  </div>

                  <div class="id-text">
                    UID:
                    ${escapeHTML(
                      deposit.uid || "-"
                    )}
                  </div>

                </td>

                <td>
                  ${money(deposit.amountUSDT)}
                </td>

                <td>
                  ${escapeHTML(
                    deposit.method || "-"
                  )}
                </td>

                <td>

                  <span class="id-text">
                    ${escapeHTML(
                      deposit.transactionId || "-"
                    )}
                  </span>

                </td>

                <td>
                  ${statusBadge(
                    deposit.status
                  )}
                </td>

                <td>

                  ${
                    isPending
                      ? `

                        <button
                          class="approve"
                          data-approve-deposit="${escapeHTML(deposit.id)}"
                        >
                          Approve
                        </button>

                        <button
                          class="reject"
                          data-reject-deposit="${escapeHTML(deposit.id)}"
                        >
                          Reject
                        </button>

                      `
                      : "-"
                  }

                </td>

              </tr>

            `;

          }).join("");

      }

    }


    /* =========================
       WITHDRAWALS
    ========================= */

    const withdrawals =
      Object.entries(withdrawalsData || {})
        .map(([id, withdrawal]) => ({
          id,
          ...(withdrawal || {})
        }));


    withdrawals.sort(
      (a, b) =>
        Number(b.createdAt || 0) -
        Number(a.createdAt || 0)
    );


    const pendingWithdrawals =
      withdrawals.filter(
        item =>
          String(item.status || "pending")
            .toLowerCase() === "pending"
      );


    setText(
      "pendingWithdrawals",
      pendingWithdrawals.length
    );


    const withdrawalsTable =
      $("withdrawalsTable");


    if (withdrawalsTable) {

      if (!withdrawals.length) {

        withdrawalsTable.innerHTML = `
          <tr>
            <td colspan="7" class="empty">
              No withdrawal requests.
            </td>
          </tr>
        `;

      } else {

        withdrawalsTable.innerHTML =
          withdrawals.map(withdrawal => {

            const isPending =
              String(withdrawal.status || "pending")
                .toLowerCase() === "pending";


            return `

              <tr>

                <td>
                  ${escapeHTML(
                    formatDate(withdrawal.createdAt)
                  )}
                </td>

                <td>

                  <div>
                    ${escapeHTML(
                      withdrawal.email || "-"
                    )}
                  </div>

                  <div class="id-text">
                    UID:
                    ${escapeHTML(
                      withdrawal.uid || "-"
                    )}
                  </div>

                </td>

                <td>
                  ${money(
                    withdrawal.amountUSDT ??
                    withdrawal.amount
                  )}
                </td>

                <td>
                  ${escapeHTML(
                    withdrawal.method || "-"
                  )}
                </td>

                <td>
                  ${escapeHTML(
                    withdrawal.accountNumber ||
                    withdrawal.account ||
                    "-"
                  )}
                </td>

                <td>
                  ${statusBadge(
                    withdrawal.status
                  )}
                </td>

                <td>

                  ${
                    isPending
                      ? `

                        <button
                          class="approve"
                          data-approve-withdrawal="${escapeHTML(withdrawal.id)}"
                        >
                          Approve
                        </button>

                        <button
                          class="reject"
                          data-reject-withdrawal="${escapeHTML(withdrawal.id)}"
                        >
                          Reject
                        </button>

                      `
                      : "-"
                  }

                </td>

              </tr>

            `;

          }).join("");

      }

    }


    showNotice(
      "Dashboard loaded successfully."
    );

  }

  catch (error) {

    console.error(
      "Dashboard loading error:",
      error
    );

    showNotice(
      `Dashboard Error: ${error.code || ""} ${error.message || error}`,
      true
    );

  }

}


/* =========================
   DEPOSIT APPROVE
========================= */

async function approveDeposit(id) {

  if (!confirm("Approve this deposit?")) {
    return;
  }


  try {

    showNotice(
      "Approving deposit..."
    );


    const depositRef =
      ref(db, `deposits/${id}`);


    const depositSnapshot =
      await get(depositRef);


    if (!depositSnapshot.exists()) {
      throw new Error(
        "Deposit not found."
      );
    }


    const deposit =
      depositSnapshot.val();


    if (
      String(
        deposit.status || "pending"
      ).toLowerCase() !== "pending"
    ) {

      throw new Error(
        "This deposit is already processed."
      );

    }


    const uid = deposit.uid;


    if (!uid) {
      throw new Error(
        "Deposit UID is missing."
      );
    }


    const userSnapshot =
      await get(
        ref(db, `users/${uid}`)
      );


    if (!userSnapshot.exists()) {
      throw new Error(
        "User profile not found."
      );
    }


    const user =
      userSnapshot.val();


    const depositAmount =
      Number(
        deposit.amountUSDT || 0
      );


    if (
      !Number.isFinite(depositAmount) ||
      depositAmount <= 0
    ) {

      throw new Error(
        "Invalid deposit amount."
      );

    }


    await update(
      ref(db),
      {

        [`deposits/${id}/status`]:
          "approved",

        [`deposits/${id}/approvedAt`]:
          Date.now(),

        [`users/${uid}/wallet`]:
          Number(user.wallet || 0) +
          depositAmount,

        [`users/${uid}/totalDeposit`]:
          Number(user.totalDeposit || 0) +
          depositAmount

      }
    );


    alert(
      "Deposit approved successfully."
    );


    await loadDashboard();

  }

  catch (error) {

    console.error(
      "Approve deposit error:",
      error
    );

    showNotice(
      `Deposit Error: ${error.code || ""} ${error.message || error}`,
      true
    );

  }

}

/* =========================
   TABLE EVENT LISTENERS
========================= */

function setupTableListeners() {

  const depositsTable =
    $("depositsTable");


  if (depositsTable) {

    depositsTable.addEventListener(
      "click",
      async (event) => {

        const approveButton =
          event.target.closest(
            "[data-approve-deposit]"
          );


        const rejectButton =
          event.target.closest(
            "[data-reject-deposit]"
          );


        if (approveButton) {

          await approveDeposit(
            approveButton.dataset.approveDeposit
          );

          return;
        }


        if (rejectButton) {

          await rejectDeposit(
            rejectButton.dataset.rejectDeposit
          );

        }

      }
    );

  }


  const withdrawalsTable =
    $("withdrawalsTable");


  if (withdrawalsTable) {

    withdrawalsTable.addEventListener(
      "click",
      async (event) => {

        const approveButton =
          event.target.closest(
            "[data-approve-withdrawal]"
          );


        const rejectButton =
          event.target.closest(
            "[data-reject-withdrawal]"
          );


        if (approveButton) {

          await approveWithdrawal(
            approveButton.dataset.approveWithdrawal
          );

          return;
        }


        if (rejectButton) {

          await rejectWithdrawal(
            rejectButton.dataset.rejectWithdrawal
          );

        }

      }
    );

  }

}


/* =========================
   LOGOUT
========================= */

function setupLogout() {

  const logoutBtn =
    $("logoutBtn");


  if (!logoutBtn) {
    return;
  }


  logoutBtn.addEventListener(
    "click",
    async () => {

      try {

        await signOut(auth);

        location.href =
          "login.html";

      }

      catch (error) {

        console.error(
          "Logout error:",
          error
        );

        showNotice(
          `Logout Error: ${error.message || error}`,
          true
        );

      }

    }
  );

}


/* =========================
   START ADMIN PAGE
========================= */

function startAdminPage() {

  setupTableListeners();

  setupLogout();


  onAuthStateChanged(
    auth,
    async (user) => {

      /* No user */
      if (!user) {

        showNotice(
          "No active login session. Please login first.",
          true
        );

        return;
      }


      /* Show admin email */
      setText(
        "adminEmail",
        user.email || "Admin"
      );


      /* =========================
         MAIN ADMIN
      ========================= */

      if (user.uid === ADMIN_UID) {

        showNotice(
          "Admin verified. Loading dashboard..."
        );

        await loadDashboard();

        return;
      }


      /* =========================
         OTHER ADMINS
      ========================= */

      try {

        showNotice(
          "Checking admin permission..."
        );


        const adminSnapshot =
          await get(
            ref(
              db,
              `admins/${user.uid}`
            )
          );


        const adminValue =
          adminSnapshot.exists()
            ? adminSnapshot.val()
            : false;


        const isAdmin =
          adminValue === true ||
          adminValue === "true";


        if (!isAdmin) {

          showNotice(
            "Access denied. This account is not an admin.",
            true
          );

          return;
        }


        showNotice(
          "Admin verified. Loading dashboard..."
        );


        await loadDashboard();

      }

      catch (error) {

        console.error(
          "Admin verification error:",
          error
        );


        showNotice(
          `Admin Error: ${error.code || ""} ${error.message || error}`,
          true
        );

      }

    }
  );

}


/* =========================
   RUN
========================= */

if (
  document.readyState === "loading"
) {

  document.addEventListener(
    "DOMContentLoaded",
    startAdminPage
  );

} else {

  startAdminPage();

}

</script>

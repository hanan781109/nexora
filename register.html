<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexora | Register</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    background:#07111f;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:25px;
}

.container{
    width:100%;
    max-width:1050px;
    min-height:650px;
    display:grid;
    grid-template-columns:1fr 1fr;
    background:#0b1728;
    border:1px solid rgba(255,255,255,.08);
    border-radius:25px;
    overflow:hidden;
    box-shadow:0 25px 70px rgba(0,0,0,.45);
}

.left{
    padding:55px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    background:
        radial-gradient(circle at 20% 20%,rgba(0,229,255,.18),transparent 35%),
        radial-gradient(circle at 80% 80%,rgba(123,44,255,.2),transparent 35%);
}

.logo{
    font-size:34px;
    font-weight:900;
    margin-bottom:25px;
}

.logo span{
    color:#00e5ff;
}

.left h1{
    font-size:42px;
    line-height:1.1;
    margin-bottom:15px;
}

.left p{
    color:#94a6bd;
    line-height:1.7;
}

.right{
    padding:50px;
    background:#091525;
    display:flex;
    flex-direction:column;
    justify-content:center;
}

.right h2{
    font-size:30px;
    margin-bottom:8px;
}

.subtitle{
    color:#8fa1b8;
    margin-bottom:28px;
}

.field{
    margin-bottom:17px;
}

.field label{
    display:block;
    color:#b7c4d5;
    margin-bottom:8px;
    font-size:14px;
}

.field input{
    width:100%;
    padding:14px 15px;
    border-radius:11px;
    border:1px solid #263850;
    background:#07111f;
    color:#fff;
    outline:none;
    font-size:15px;
}

.field input:focus{
    border-color:#00c6ff;
}

.register-btn{
    width:100%;
    padding:15px;
    margin-top:8px;
    border:0;
    border-radius:11px;
    background:linear-gradient(135deg,#00c6ff,#7b2cff);
    color:#fff;
    font-weight:800;
    font-size:16px;
    cursor:pointer;
}

.register-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.message{
    min-height:22px;
    margin-top:15px;
    text-align:center;
    font-size:14px;
    color:#ffb4b4;
}

.login{
    text-align:center;
    margin-top:20px;
    color:#8fa1b8;
}

.login a{
    color:#00d9ff;
    text-decoration:none;
    font-weight:700;
}

.ref-note{
    margin-top:-8px;
    margin-bottom:18px;
    color:#00e5ff;
    font-size:13px;
    display:none;
}

@media(max-width:800px){

    .container{
        grid-template-columns:1fr;
    }

    .left{
        padding:35px;
    }

    .left h1{
        font-size:32px;
    }

    .right{
        padding:35px;
    }
}
</style>
</head>

<body>

<div class="container">

    <section class="left">

        <div class="logo">
            NEX<span>ORA</span>
        </div>

        <h1>Start Your Nexora Journey.</h1>

        <p>
            Create your account and access your Nexora dashboard,
            plans, deposits, withdrawals and referral center.
        </p>

    </section>


    <section class="right">

        <h2>Create Account</h2>

        <p class="subtitle">
            Register your new Nexora account.
        </p>


        <form id="registerForm">

            <div class="field">
                <label>Full Name</label>
                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                    required
                >
            </div>


            <div class="field">
                <label>Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >
            </div>


            <div class="field">
                <label>Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Create password"
                    minlength="6"
                    required
                >
            </div>


            <div class="field">
                <label>Referral Code</label>

                <input
                    type="text"
                    id="referral"
                    placeholder="Enter referral code"
                    autocomplete="off"
                >
            </div>


            <div id="refNote" class="ref-note">
                Referral code detected ✓
            </div>


            <button
                type="submit"
                class="register-btn"
                id="registerBtn"
            >
                Create Account
            </button>


            <div
                class="message"
                id="message"
            ></div>

        </form>


        <div class="login">
            Already have an account?
            <a href="user-login.html">Login</a>
        </div>

    </section>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
    getAuth,
    createUserWithEmailAndPassword,
    updateProfile
}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
    getDatabase,
    ref,
    get,
    set,
    update
}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";


const firebaseConfig = {

    apiKey: "AIzaSyBr-z5-7I8_WEy-XuQX8Z5dXa9XtCxXba0",

    authDomain:
        "nexora-adef3.firebaseapp.com",

    databaseURL:
        "https://nexora-adef3-default-rtdb.firebaseio.com",

    projectId:
        "nexora-adef3",

    storageBucket:
        "nexora-adef3.firebasestorage.app",

    messagingSenderId:
        "318277373899",

    appId:
        "1:318277373899:web:0d2f97b1fa99cc7702304e",

    measurementId:
        "G-WN2V48SC4T"
};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getDatabase(app);


const form =
    document.getElementById("registerForm");

const message =
    document.getElementById("message");

const registerBtn =
    document.getElementById("registerBtn");

const referralInput =
    document.getElementById("referral");

const refNote =
    document.getElementById("refNote");


/*
==================================================
IMPORTANT REFERRAL AUTO-FILL
==================================================
*/

const urlParams =
    new URLSearchParams(window.location.search);

const urlReferral =
    (urlParams.get("ref") || "")
    .trim()
    .toUpperCase();


if(urlReferral){

    referralInput.value = urlReferral;

    refNote.style.display = "block";

}


/*
==================================================
REGISTER
==================================================
*/

form.addEventListener("submit", async (e) => {

    e.preventDefault();


    message.textContent = "";

    registerBtn.disabled = true;

    registerBtn.textContent = "Creating Account...";


    try{

        const name =
            document.getElementById("name")
            .value.trim();

        const email =
            document.getElementById("email")
            .value.trim()
            .toLowerCase();

        const password =
            document.getElementById("password")
            .value;


        /*
          Manual referral OR URL referral
        */

        const manualReferral =
            referralInput.value
            .trim()
            .toUpperCase();

        const referral =
            manualReferral || urlReferral;


        /*
          Create Firebase Auth account
        */

        const credential =
            await createUserWithEmailAndPassword(
                auth,
                email,
                password
            );


        const user =
            credential.user;


        /*
          Save display name
        */

        await updateProfile(user,{
            displayName:name
        });


        /*
          Generate NEW referral code
          for this new member
        */

        const ownReferralCode =
            "NXR" +
            user.uid
            .slice(0,6)
            .toUpperCase();


        /*
          Find referrer
        */

        let referrerUid = "";

        let referredBy = "";


        if(referral){

            const usersSnapshot =
                await get(ref(db,"users"));


            if(usersSnapshot.exists()){

                const users =
                    usersSnapshot.val();


                const matchingEntry =
                    Object.entries(users)
                    .find(([uid,u]) => {

                        if(!u) return false;


                        const existingCode =
                            String(
                                u.referralCode || ""
                            )
                            .trim()
                            .toUpperCase();


                        return existingCode === referral;

                    });


                if(matchingEntry){

                    referrerUid =
                        matchingEntry[0];

                    referredBy =
                        String(
                            matchingEntry[1]
                            .referralCode
                        )
                        .trim();

                }

            }

        }


        /*
          New user database record
        */

        const userData = {

            uid:user.uid,

            name:name,

            email:email,

            referralCode:
                ownReferralCode,

            referredBy:
                referredBy,

            referrerUid:
                referrerUid,

            wallet:0,

            totalDeposit:0,

            totalWithdrawal:0,

            referralEarnings:0,

            directReferrals:0,

            activePlans:{},

            totalPlanPurchase:0,

            createdAt:Date.now(),

            updatedAt:Date.now()

        };


        /*
          Save new user
        */

        await set(
            ref(db,"users/" + user.uid),
            userData
        );


        /*
          Update referrer's count
        */

        if(referrerUid){

            const referrerSnapshot =
                await get(
                    ref(db,"users/" + referrerUid)
                );


            if(referrerSnapshot.exists()){

                const referrerData =
                    referrerSnapshot.val();


                const oldCount =
                    Number(
                        referrerData.directReferrals || 0
                    );


                await update(
                    ref(
                        db,
                        "users/" + referrerUid
                    ),
                    {

                        directReferrals:
                            oldCount + 1,

                        updatedAt:
                            Date.now()

                    }
                );

            }

        }


        /*
          Success
        */

        message.style.color =
            "#00e676";

        message.textContent =
            "Account created successfully!";


        setTimeout(() => {

            window.location.href =
                "dashboard.html";

        },800);


    }
    catch(error){

        console.error(
            "Registration Error:",
            error
        );


        message.style.color =
            "#ff6b6b";


        if(error.code === "auth/email-already-in-use"){

            message.textContent =
                "This email is already registered.";

        }
        else if(error.code === "auth/invalid-email"){

            message.textContent =
                "Please enter a valid email.";

        }
        else if(error.code === "auth/weak-password"){

            message.textContent =
                "Password must be at least 6 characters.";

        }
        else if(
            error.code ===
            "PERMISSION_DENIED"
        ){

            message.textContent =
                "Firebase permission denied.";

        }
        else{

            message.textContent =
                error.message ||
                "Registration failed.";

        }

    }
    finally{

        registerBtn.disabled = false;

        registerBtn.textContent =
            "Create Account";

    }

});

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexora - Plans</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial,Helvetica,sans-serif;
    }

    body{
      min-height:100vh;
      background:
        radial-gradient(circle at top left,#263b8f 0%,transparent 35%),
        radial-gradient(circle at top right,#7026a8 0%,transparent 35%),
        linear-gradient(135deg,#070b1d,#111936 55%,#090d20);
      color:#fff;
    }

    header{
      position:sticky;
      top:0;
      z-index:10;
      padding:18px 6%;
      background:rgba(7,11,29,.88);
      backdrop-filter:blur(14px);
      border-bottom:1px solid rgba(255,255,255,.1);
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .logo{
      font-size:26px;
      font-weight:800;
      letter-spacing:1px;
      background:linear-gradient(90deg,#00eaff,#a855f7,#ff4ecd);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .back{
      text-decoration:none;
      color:#fff;
      padding:10px 18px;
      border-radius:12px;
      background:rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.12);
    }

    .container{
      width:92%;
      max-width:1200px;
      margin:35px auto 60px;
    }

    .top-box{
      text-align:center;
      margin-bottom:30px;
    }

    .top-box h1{
      font-size:38px;
      margin-bottom:10px;
    }

    .top-box p{
      color:#b9c2df;
      font-size:15px;
    }

    .wallet{
      margin:25px auto 35px;
      max-width:500px;
      padding:20px;
      border-radius:20px;
      background:linear-gradient(
        135deg,
        rgba(0,234,255,.12),
        rgba(168,85,247,.14)
      );
      border:1px solid rgba(255,255,255,.12);
      text-align:center;
      box-shadow:0 15px 40px rgba(0,0,0,.25);
    }

    .wallet small{
      color:#aeb8d7;
      display:block;
      margin-bottom:8px;
    }

    .wallet strong{
      font-size:32px;
      color:#fff;
    }

    .plans{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
      gap:20px;
    }

    .plan{
      position:relative;
      padding:25px;
      border-radius:22px;
      background:rgba(255,255,255,.07);
      border:1px solid rgba(255,255,255,.12);
      box-shadow:0 15px 45px rgba(0,0,0,.25);
      transition:.25s;
      overflow:hidden;
    }

    .plan:hover{
      transform:translateY(-5px);
      border-color:rgba(0,234,255,.45);
    }

    .plan.purchased{
      border-color:rgba(0,255,170,.5);
      box-shadow:0 0 25px rgba(0,255,170,.08);
    }

    .plan h2{
      font-size:25px;
      margin-bottom:8px;
    }

    .price{
      font-size:36px;
      font-weight:800;
      margin:12px 0;
      background:linear-gradient(90deg,#00eaff,#a855f7);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .details{
      color:#c1c9e3;
      line-height:1.8;
      font-size:14px;
      margin-bottom:18px;
    }

    button{
      width:100%;
      border:none;
      padding:13px;
      border-radius:13px;
      cursor:pointer;
      color:#fff;
      font-size:15px;
      font-weight:700;
      background:linear-gradient(90deg,#00a8ff,#7c3aed,#d946ef);
      transition:.2s;
    }

    button:hover{
      transform:scale(1.02);
    }

    button:disabled{
      opacity:.65;
      cursor:not-allowed;
      transform:none;
    }

    .purchased-btn{
      background:linear-gradient(90deg,#00a86b,#00c98a);
      cursor:default;
    }

    .expired-btn{
      background:rgba(255,255,255,.1);
      cursor:default;
    }

    .status{
      display:inline-block;
      margin-bottom:12px;
      padding:6px 11px;
      border-radius:20px;
      font-size:11px;
      font-weight:800;
      letter-spacing:.5px;
    }

    .status.active{
      background:rgba(0,255,170,.12);
      color:#45ffc2;
      border:1px solid rgba(0,255,170,.25);
    }

    .status.expired{
      background:rgba(255,180,0,.1);
      color:#ffc857;
      border:1px solid rgba(255,180,0,.2);
    }

    .message{
      display:none;
      max-width:650px;
      margin:0 auto 25px;
      padding:14px 18px;
      border-radius:13px;
      text-align:center;
      font-size:14px;
    }

    .message.show{
      display:block;
    }

    .message.success{
      background:rgba(0,255,170,.1);
      border:1px solid rgba(0,255,170,.25);
      color:#55ffc7;
    }

    .message.error{
      background:rgba(255,70,100,.1);
      border:1px solid rgba(255,70,100,.25);
      color:#ff8da0;
    }

    @media(max-width:600px){
      .top-box h1{
        font-size:30px;
      }

      .wallet strong{
        font-size:27px;
      }

      header{
        padding:15px 4%;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">NEXORA</div>
  <a class="back" href="dashboard.html">Dashboard</a>
</header>

<div class="container">

  <div class="top-box">
    <h1>Choose Your Plan</h1>
    <p>Activate a package and manage it from your dashboard.</p>
  </div>

  <div class="wallet">
    <small>Available Wallet Balance</small>
    <strong id="wallet">$0.00 USDT</strong>
  </div>

  <div id="message" class="message"></div>

  <div id="plans" class="plans"></div>

</div>

<script type="module">

  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

  import {
    getAuth,
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

  import {
    getDatabase,
    ref,
    get,
    update
  } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";


  /* =========================
     FIREBASE
  ========================= */

  const firebaseConfig = {
    apiKey: "AIzaSyBr-z5-7I8_WEy-XuQX8Z5dXa9XtCxXba0",
    authDomain: "nexora-adef3.firebaseapp.com",
    databaseURL: "https://nexora-adef3-default-rtdb.firebaseio.com",
    projectId: "nexora-adef3",
    storageBucket: "nexora-adef3.firebasestorage.app",
    messagingSenderId: "318277373899",
    appId: "1:318277373899:web:0d2f97b1fa99cc7702304e",
    measurementId: "G-WN2V48SC4T"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);


  /* =========================
     PLANS
  ========================= */

  const plans = [
    5,
    10,
    20,
    50,
    100,
    200,
    500
  ];

  const PLAN_DURATION =
    30 * 24 * 60 * 60 * 1000;


  let currentUser = null;
  let currentProfile = {};
  let activePlans = [];


  /* =========================
     HELPERS
  ========================= */

  function money(value){
    return Number(value || 0).toFixed(2);
  }


  function showMessage(text,type="success"){
    const box = document.getElementById("message");

    box.textContent = text;
    box.className = "message show " + type;

    setTimeout(()=>{
      box.className = "message";
    },5000);
  }


  function getActivePlanForAmount(amount){

    const now = Date.now();

    const matches = activePlans.filter(plan => {

      const planAmount =
        Number(plan.amount || plan.amountUSDT || plan.price || plan.planAmount || 0);

      const expiresAt =
        Number(plan.expiresAt || 0);

      // Agar expiration date na miley, tab bhi active samjha jaye (Purane users ke case mein)
      const isExpired = expiresAt > 0 ? (expiresAt < now) : false;

      return (
        planAmount === Number(amount) &&
        !isExpired &&
        plan.status !== "expired"
      );

    });

    if(matches.length === 0){
      return null;
    }

    matches.sort((a,b) =>
      Number(b.createdAt || 0) -
      Number(a.createdAt || 0)
    );

    return matches[0];
  }


  function formatDate(timestamp){

    if(!timestamp) return "Active";

    return new Date(timestamp).toLocaleDateString(
      "en-US",
      {
        year:"numeric",
        month:"short",
        day:"numeric"
      }
    );
  }


  /* =========================
     LOAD USER PROFILE
  ========================= */

  async function loadProfile(){

    if(!currentUser) return;

    try{

      const userRef =
        ref(db,"users/" + currentUser.uid);

      const snap = await get(userRef);

      if(!snap.exists()){

        currentProfile = {
          wallet:0,
          activePlans:[],
          totalPlanPurchase:0
        };

      }else{

        currentProfile = snap.val() || {};

      }

      const wallet =
        Number(currentProfile.wallet || 0);

      document.getElementById("wallet").textContent =
        "$" + money(wallet) + " USDT";


      // --- NAYA FLEXIBLE BACKWARD COMPATIBLE LOGIC ---
      let parsedPlans = [];

      // 1. Agar Array format mein mile
      if (Array.isArray(currentProfile.activePlans)) {
        parsedPlans = currentProfile.activePlans;
      } 
      // 2. Agar Object format mein save ho gaya tha
      else if (currentProfile.activePlans && typeof currentProfile.activePlans === 'object') {
        parsedPlans = Object.values(currentProfile.activePlans);
      }
      // 3. Agar 'plans' object exist karta ho
      else if (currentProfile.plans && typeof currentProfile.plans === 'object') {
        parsedPlans = Object.values(currentProfile.plans);
      }

      // 4. FALLBACK FOR OLD USERS (Agar koi activePlans field nahi bani thi pehle)
      if (parsedPlans.length === 0) {
        const oldAmount = Number(
          currentProfile.lastPlanPurchase || 
          currentProfile.planAmount || 
          currentProfile.planPrice || 
          currentProfile.currentPlan || 0
        );

        if (oldAmount > 0) {
          const createdAt = Number(currentProfile.lastPlanPurchaseAt || Date.now());
          parsedPlans.push({
            purchaseId: currentUser.uid + "_legacy_" + oldAmount,
            amount: oldAmount,
            amountUSDT: oldAmount,
            status: "active",
            durationDays: 30,
            createdAt: createdAt,
            expiresAt: createdAt + PLAN_DURATION
          });

          // System background mein user profile sync/repair kar dega
          try {
            await update(ref(db, "users/" + currentUser.uid), {
              activePlans: parsedPlans
            });
          } catch(e) { console.log("Legacy sync skipped", e); }
        }
      }

      activePlans = parsedPlans;

      renderPlans();

    }catch(error){

      console.error("Profile error:",error);

      showMessage(
        "Unable to load your profile.",
        "error"
      );

    }

  }


  /* =========================
     RENDER PLANS
  ========================= */

  function renderPlans(){

    const container =
      document.getElementById("plans");

    container.innerHTML = "";

    plans.forEach(amount => {

      const activePlan =
        getActivePlanForAmount(amount);

      const card =
        document.createElement("div");

      card.className =
        "plan" +
        (activePlan ? " purchased" : "");


      let statusHTML = "";
      let buttonHTML = "";


      if(activePlan){

        statusHTML = `
          <div class="status active">
            PLAN PURCHASED
          </div>
        `;

        buttonHTML = `
          <button
            class="purchased-btn"
            disabled
          >
            ACTIVE UNTIL ${formatDate(activePlan.expiresAt)}
          </button>
        `;

      }else{

        statusHTML = `
          <div class="status expired">
            30 DAYS PACKAGE
          </div>
        `;

        buttonHTML = `
          <button
            class="buy-btn"
            data-amount="${amount}"
          >
            Buy Plan
          </button>
        `;
      }


      card.innerHTML = `

        ${statusHTML}

        <h2>$${amount} Plan</h2>

        <div class="price">
          $${amount}
        </div>

        <div class="details">
          <div>Package Value: $${amount} USDT</div>
          <div>Duration: 30 Days</div>
          <div>Status: ${activePlan ? "Active" : "Available"}</div>
        </div>

        ${buttonHTML}

      `;


      container.appendChild(card);

    });


    document.querySelectorAll(".buy-btn")
      .forEach(button => {

        button.addEventListener(
          "click",
          () => {

            const amount =
              Number(button.dataset.amount);

            buyPlan(amount,button);

          }
        );

      });

  }


  /* =========================
     BUY PLAN
  ========================= */

  async function buyPlan(amount,button){

    if(!currentUser){

      showMessage(
        "Please login first.",
        "error"
      );

      return;
    }


    button.disabled = true;
    button.textContent = "Processing...";


    try{

      /* -------------------------
          READ USER
      ------------------------- */

      const userRef =
        ref(db,"users/" + currentUser.uid);

      const userSnap =
        await get(userRef);


      if(!userSnap.exists()){

        throw new Error(
          "User profile was not found."
        );

      }


      const buyer =
        userSnap.val() || {};


      const wallet =
        Number(buyer.wallet || 0);


      if(!Number.isFinite(wallet)){

        throw new Error(
          "Wallet balance is invalid."
        );

      }


      if(wallet < amount){

        throw new Error(
          `Insufficient balance. You need $${money(amount)} USDT.`
        );

      }


      /* -------------------------
          CHECK EXISTING PLAN
      ------------------------- */

      const existingPlan =
        getActivePlanForAmount(amount);

      if(existingPlan){

        showMessage(
          "This plan is already active.",
          "error"
        );

        button.disabled = true;
        button.textContent =
          "PLAN ALREADY PURCHASED";

        return;

      }


      /* -------------------------
          CREATE PURCHASE
      ------------------------- */

      const now =
        Date.now();

      const expiresAt =
        now + PLAN_DURATION;


      const purchaseId =
        currentUser.uid +
        "_" +
        now +
        "_" +
        amount;


      const purchase = {

        purchaseId: purchaseId,

        uid: currentUser.uid,

        email:
          currentUser.email || "",

        amount: amount,

        amountUSDT: amount,

        status: "active",

        durationDays: 30,

        createdAt: now,

        expiresAt: expiresAt

      };


      /* -------------------------
          NEW ACTIVE PLAN
      ------------------------- */

      const oldActivePlans = activePlans;

      const newPlan = {

        purchaseId: purchaseId,

        amount: amount,

        amountUSDT: amount,

        status: "active",

        durationDays: 30,

        createdAt: now,

        expiresAt: expiresAt

      };


      const newActivePlans =
        [
          ...oldActivePlans,
          newPlan
        ];


      const newWallet =
        wallet - amount;


      const oldTotal =
        Number(buyer.totalPlanPurchase || 0);


      const newTotal =
        oldTotal + amount;


      /* -------------------------
          REFERRAL
      ------------------------- */

      let referrerUid = null;
      let referralCommission = 0;
      let referrerNewWallet = null;


      if(buyer.referrerUid){

        referrerUid =
          buyer.referrerUid;

      }else if(buyer.referredBy){

        const usersSnap =
          await get(ref(db,"users"));

        if(usersSnap.exists()){

          const users =
            usersSnap.val() || {};

          for(const uid in users){

            const u =
              users[uid] || {};

            if(
              String(u.referralCode || "")
                .toLowerCase() ===
              String(buyer.referredBy || "")
                .toLowerCase()
            ){

              referrerUid = uid;
              break;

            }

          }

        }

      }


      /*
        Referral commission:
        20% of the plan amount.
      */

      if(
        referrerUid &&
        referrerUid !== currentUser.uid
      ){

        const referrerSnap =
          await get(
            ref(db,"users/" + referrerUid)
          );


        if(referrerSnap.exists()){

          const referrer =
            referrerSnap.val() || {};

          const referrerWallet =
            Number(referrer.wallet || 0);


          referralCommission =
            Number(
              (amount * 0.20).toFixed(2)
            );


          referrerNewWallet =
            Number(
              (
                referrerWallet +
                referralCommission
              ).toFixed(2)
            );

        }

      }


      /* -------------------------
          ATOMIC FIREBASE UPDATE
      ------------------------- */

      const updates = {};


      /* Buyer wallet */

      updates[
        "users/" +
        currentUser.uid +
        "/wallet"
      ] = newWallet;


      /* Buyer active plans */

      updates[
        "users/" +
        currentUser.uid +
        "/activePlans"
      ] = newActivePlans;


      /* Total plan purchase */

      updates[
        "users/" +
        currentUser.uid +
        "/totalPlanPurchase"
      ] = newTotal;


      /* Last purchase */

      updates[
        "users/" +
        currentUser.uid +
        "/lastPlanPurchase"
      ] = amount;


      updates[
        "users/" +
        currentUser.uid +
        "/lastPlanPurchaseAt"
      ] = now;


      /* Purchase record */

      updates[
        "planPurchases/" +
        purchaseId
      ] = purchase;


      /* Referral commission */

      if(
        referrerUid &&
        referrerNewWallet !== null
      ){

        updates[
          "users/" +
          referrerUid +
          "/wallet"
        ] = referrerNewWallet;


        updates[
          "users/" +
          referrerUid +
          "/referralEarnings"
        ] =
          Number(
            (
              Number(
                (
                  await get(
                    ref(
                      db,
                      "users/" +
                      referrerUid +
                      "/referralEarnings"
                    )
                  )
                ).val() || 0
              ) +
              referralCommission
            ).toFixed(2)
          );


        updates[
          "referralCommissions/" +
          purchaseId
        ] = {

          purchaseId: purchaseId,

          fromUid: currentUser.uid,

          toUid: referrerUid,

          amount: referralCommission,

          percent: 20,

          createdAt: now,

          status: "credited"

        };

      }


      await update(
        ref(db),
        updates
      );


      /* -------------------------
          SUCCESS
      ------------------------- */

      showMessage(
        `$${money(amount)} plan purchased successfully.`,
        "success"
      );


      await loadProfile();


    }catch(error){

      console.error(
        "PLAN PURCHASE ERROR:",
        error
      );

      console.error(
        "Firebase error code:",
        error.code
      );

      showMessage(
        error.message ||
        "Plan purchase failed.",
        "error"
      );


      button.disabled = false;
      button.textContent = "Buy Plan";

    }

  }


  /* =========================
     AUTH
  ========================= */

  onAuthStateChanged(
    auth,
    async user => {

      if(!user){

        window.location.href =
          "login.html";

        return;

      }


      currentUser = user;

      await loadProfile();

    }
  );

</script>

</body>
</html>

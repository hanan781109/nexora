<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexora - Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background:
        radial-gradient(circle at top left, #4f46e5, transparent 35%),
        radial-gradient(circle at bottom right, #ec4899, transparent 35%),
        #07111f;
      color: white;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      padding: 35px;
      border-radius: 24px;
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 25px 70px rgba(0,0,0,0.45);
    }

    .logo {
      text-align: center;
      font-size: 34px;
      font-weight: 800;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #22d3ee, #8b5cf6, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      text-align: center;
      color: #94a3b8;
      margin-bottom: 30px;
    }

    .input-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #cbd5e1;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px 15px;
      border-radius: 12px;
      border: 1px solid #334155;
      outline: none;
      background: #0f172a;
      color: white;
      font-size: 15px;
    }

    input:focus {
      border-color: #8b5cf6;
      box-shadow: 0 0 0 3px rgba(139,92,246,0.15);
    }

    .password-wrap {
      position: relative;
    }

    .password-wrap input {
      padding-right: 55px;
    }

    .toggle-password {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      color: #94a3b8;
      font-size: 13px;
      user-select: none;
    }

    .options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 10px 0 22px;
      font-size: 13px;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 7px;
      color: #94a3b8;
    }

    .remember input {
      width: auto;
    }

    .forgot {
      color: #22d3ee;
      cursor: pointer;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 13px;
      cursor: pointer;
      color: white;
      font-size: 16px;
      font-weight: 700;
      background: linear-gradient(90deg, #06b6d4, #7c3aed, #ec4899);
      transition: 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(124,58,237,0.35);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .message {
      display: none;
      margin-top: 16px;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      text-align: center;
    }

    .error {
      display: block;
      background: rgba(239,68,68,0.12);
      border: 1px solid rgba(239,68,68,0.3);
      color: #fca5a5;
    }

    .success {
      display: block;
      background: rgba(34,197,94,0.12);
      border: 1px solid rgba(34,197,94,0.3);
      color: #86efac;
    }

    .register {
      text-align: center;
      margin-top: 24px;
      color: #94a3b8;
      font-size: 14px;
    }

    .register a {
      color: #22d3ee;
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">NEXORA</div>
    <div class="subtitle">Welcome back. Login to your account.</div>

    <form id="loginForm">

      <div class="input-group">
        <label>Email Address</label>
        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          required
        >
      </div>

      <div class="input-group">
        <label>Password</label>

        <div class="password-wrap">
          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required
          >

          <span
            class="toggle-password"
            id="togglePassword"
          >Show</span>
        </div>
      </div>

      <div class="options">

        <label class="remember">
          <input type="checkbox" id="rememberMe">
          Remember me
        </label>

        <span class="forgot" id="forgotPassword">
          Forgot Password?
        </span>

      </div>

      <button type="submit" id="loginBtn">
        Login
      </button>

      <div id="message" class="message"></div>

    </form>

    <div class="register">
      Don't have an account?
      <a href="register.html">Create Account</a>
    </div>

  </div>


  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      sendPasswordResetEmail,
      setPersistence,
      browserLocalPersistence,
      browserSessionPersistence
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

    import {
      getDatabase,
      ref,
      get
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";


    // =========================
    // FIREBASE CONFIG
    // =========================

    const firebaseConfig = {
      apiKey: "AIzaSyBr-z5-7I8_WEy-XuQX8Z5dXa9XtCxXba0",
      authDomain: "nexora-adef3.firebaseapp.com",
      projectId: "nexora-adef3",
      storageBucket: "nexora-adef3.firebasestorage.app",
      messagingSenderId: "318277373899",
      appId: "1:318277373899:web:0d2f97b1fa99cc7702304e",
      measurementId: "G-WN2V48SC4T"
    };


    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getDatabase(app);


    // =========================
    // ADMIN UID
    // =========================

    const ADMIN_UID =
      "6wsARRpgWwaez7qg86fjCNS4SY13";


    // =========================
    // ELEMENTS
    // =========================

    const loginForm =
      document.getElementById("loginForm");

    const emailInput =
      document.getElementById("email");

    const passwordInput =
      document.getElementById("password");

    const rememberMe =
      document.getElementById("rememberMe");

    const loginBtn =
      document.getElementById("loginBtn");

    const message =
      document.getElementById("message");

    const togglePassword =
      document.getElementById("togglePassword");

    const forgotPassword =
      document.getElementById("forgotPassword");


    // =========================
    // MESSAGE
    // =========================

    function showMessage(text, type = "error") {

      message.textContent = text;

      message.className =
        "message " + type;

    }


    // =========================
    // PASSWORD SHOW/HIDE
    // =========================

    togglePassword.addEventListener("click", () => {

      if (passwordInput.type === "password") {

        passwordInput.type = "text";

        togglePassword.textContent = "Hide";

      } else {

        passwordInput.type = "password";

        togglePassword.textContent = "Show";

      }

    });


    // =========================
    // LOGIN
    // =========================

    loginForm.addEventListener("submit", async (e) => {

      e.preventDefault();

      const email =
        emailInput.value.trim();

      const password =
        passwordInput.value;


      if (!email || !password) {

        showMessage(
          "Please enter email and password."
        );

        return;

      }


      loginBtn.disabled = true;

      loginBtn.textContent =
        "Logging in...";

      message.className =
        "message";

      try {

        // Remember me
        if (rememberMe.checked) {

          await setPersistence(
            auth,
            browserLocalPersistence
          );

        } else {

          await setPersistence(
            auth,
            browserSessionPersistence
          );

        }


        // Firebase login
        const credential =
          await signInWithEmailAndPassword(
            auth,
            email,
            password
          );


        const user =
          credential.user;


        console.log(
          "Logged in UID:",
          user.uid
        );


        // =====================================
        // ADMIN CHECK
        // =====================================

        if (user.uid === ADMIN_UID) {

          showMessage(
            "Admin login successful! Redirecting...",
            "success"
          );

          setTimeout(() => {

            window.location.href =
              "admin.html";

          }, 500);

          return;
        }


        // =====================================
        // DATABASE ADMIN CHECK
        // =====================================

        try {

          const adminSnapshot =
            await get(
              ref(db, `admins/${user.uid}`)
            );


          if (
            adminSnapshot.exists() &&
            adminSnapshot.val() === true
          ) {

            showMessage(
              "Admin login successful! Redirecting...",
              "success"
            );

            setTimeout(() => {

              window.location.href =
                "admin.html";

            }, 500);

            return;

          }

        } catch (adminError) {

          console.log(
            "Admin database check:",
            adminError
          );

          // Agar normal user hai aur
          // admins read permission na ho,
          // to normal dashboard par bhej do.

        }


        // =====================================
        // NORMAL USER
        // =====================================

        showMessage(
          "Login successful! Redirecting...",
          "success"
        );

        setTimeout(() => {

          window.location.href =
            "dashboard.html";

        }, 500);


      } catch (error) {

        console.error(
          "Login Error:",
          error
        );


        let errorMessage =
          "Login failed. Please try again.";


        if (
          error.code ===
          "auth/invalid-credential"
        ) {

          errorMessage =
            "Email or password is incorrect.";

        } else if (
          error.code ===
          "auth/user-not-found"
        ) {

          errorMessage =
            "No account found with this email.";

        } else if (
          error.code ===
          "auth/wrong-password"
        ) {

          errorMessage =
            "Incorrect password.";

        } else if (
          error.code ===
          "auth/invalid-email"
        ) {

          errorMessage =
            "Please enter a valid email.";

        } else if (
          error.code ===
          "auth/too-many-requests"
        ) {

          errorMessage =
            "Too many attempts. Please try again later.";

        }


        showMessage(errorMessage);

      } finally {

        loginBtn.disabled = false;

        loginBtn.textContent =
          "Login";

      }

    });


    // =========================
    // FORGOT PASSWORD
    // =========================

    forgotPassword.addEventListener(
      "click",
      async () => {

        const email =
          emailInput.value.trim();


        if (!email) {

          showMessage(
            "Enter your email first, then click Forgot Password."
          );

          emailInput.focus();

          return;

        }


        try {

          await sendPasswordResetEmail(
            auth,
            email
          );

          showMessage(
            "Password reset email sent. Check your inbox.",
            "success"
          );

        } catch (error) {

          console.error(
            "Password reset error:",
            error
          );

          showMessage(
            "Could not send reset email. Check the email address."
          );

        }

      }
    );

  </script>

</body>
</html>

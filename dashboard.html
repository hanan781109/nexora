<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexora Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #07111f;
      color: #fff;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, #101d38, #182d58);
      padding: 18px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #263b63;
    }

    header h2 {
      color: #42e8ff;
    }

    .logout {
      background: #ff4f81;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 25px;
    }

    .welcome {
      margin-bottom: 25px;
    }

    .welcome h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .welcome p {
      color: #9fb0c9;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
    }

    .card {
      background: linear-gradient(145deg, #101d34, #142746);
      border: 1px solid #263b63;
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 10px 30px rgba(0,0,0,.2);
    }

    .card h3 {
      color: #9fb0c9;
      font-size: 15px;
      margin-bottom: 12px;
    }

    .amount {
      font-size: 30px;
      font-weight: bold;
      color: #42e8ff;
    }

    .ref {
      margin-top: 25px;
      background: linear-gradient(135deg, #24154b, #182b55);
      border: 1px solid #6546a8;
      border-radius: 18px;
      padding: 22px;
    }

    .ref h3 {
      margin-bottom: 12px;
    }

    #referralCode {
      color: #ff6fa5;
      font-size: 20px;
      font-weight: bold;
      word-break: break-all;
    }

    .loading {
      text-align: center;
      padding: 50px;
      color: #9fb0c9;
    }

    .error {
      text-align: center;
      color: #ff6b8a;
      padding: 30px;
    }

    @media(max-width:600px) {
      .container {
        padding: 18px;
      }

      .welcome h1 {
        font-size: 23px;
      }

      .amount {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>

<header>
  <h2>NEXORA</h2>
  <button class="logout" id="logoutBtn">Logout</button>
</header>

<div class="container">

  <div class="welcome">
    <h1>Welcome Back 👋</h1>
    <p id="userEmail">Loading account...</p>
  </div>

  <div id="loading" class="loading">
    Loading your account...
  </div>

  <div id="dashboard" style="display:none;">

    <div class="cards">

      <div class="card">
        <h3>Available Balance</h3>
        <div class="amount">$<span id="wallet">0.00</span></div>
      </div>

      <div class="card">
        <h3>Total Deposits</h3>
        <div class="amount">$<span id="totalDeposit">0.00</span></div>
      </div>

      <div class="card">
        <h3>Total Withdrawals</h3>
        <div class="amount">$<span id="totalWithdrawal">0.00</span></div>
      </div>

      <div class="card">
        <h3>Referral Earnings</h3>
        <div class="amount">$<span id="referralEarnings">0.00</span></div>
      </div>

      <div class="card">
        <h3>Direct Referrals</h3>
        <div class="amount"><span id="directReferrals">0</span></div>
      </div>

    </div>

    <div class="ref">
      <h3>Your Referral Code</h3>
      <div id="referralCode">---</div>
    </div>

  </div>

  <div id="errorBox" class="error" style="display:none;"></div>

</div>


<script type="module">

  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

  import {
    getAuth,
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

  import {
    getDatabase,
    ref,
    onValue
  } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";


  const firebaseConfig = {
    apiKey: "AIzaSyBr-z5-7I8_WEy-XuQX8Z5dXa9XtCxXba0",
    authDomain: "nexora-adef3.firebaseapp.com",
    projectId: "nexora-adef3",
    storageBucket: "nexora-adef3.firebasestorage.app",
    messagingSenderId: "318277373899",
    appId: "1:318277373899:web:0d2f97b1fa99cc7702304e",
    measurementId: "G-WN2V48SC4T"
  };


  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);


  const loading = document.getElementById("loading");
  const dashboard = document.getElementById("dashboard");
  const errorBox = document.getElementById("errorBox");


  function money(value) {
    const num = Number(value);

    if (!Number.isFinite(num)) {
      return "0.00";
    }

    return num.toFixed(2);
  }


  onAuthStateChanged(auth, (user) => {

    if (!user) {
      window.location.href = "login.html";
      return;
    }


    document.getElementById("userEmail").textContent =
      user.email || "User";


    const userRef = ref(db, "users/" + user.uid);


    /*
      IMPORTANT:
      onValue database ko realtime mein listen karta hai.
      Dashboard khud wallet ko change nahi karta.
      Firebase mein wallet change hoga to yahan automatically
      latest value show hogi.
    */

    onValue(userRef, (snapshot) => {

      loading.style.display = "none";

      if (!snapshot.exists()) {

        dashboard.style.display = "none";
        errorBox.style.display = "block";

        errorBox.textContent =
          "User data not found in database.";

        return;
      }


      const data = snapshot.val() || {};


      const wallet =
        Number(data.wallet) || 0;

      const totalDeposit =
        Number(data.totalDeposit) || 0;

      const totalWithdrawal =
        Number(data.totalWithdrawal) || 0;

      const referralEarnings =
        Number(data.referralEarnings) || 0;

      const directReferrals =
        Number(data.directReferrals) || 0;

      const referralCode =
        data.referralCode || "---";


      document.getElementById("wallet").textContent =
        money(wallet);

      document.getElementById("totalDeposit").textContent =
        money(totalDeposit);

      document.getElementById("totalWithdrawal").textContent =
        money(totalWithdrawal);

      document.getElementById("referralEarnings").textContent =
        money(referralEarnings);

      document.getElementById("directReferrals").textContent =
        directReferrals;

      document.getElementById("referralCode").textContent =
        referralCode;


      dashboard.style.display = "block";
      errorBox.style.display = "none";

    }, (error) => {

      loading.style.display = "none";
      dashboard.style.display = "none";
      errorBox.style.display = "block";

      errorBox.textContent =
        "Database error: " + error.message;

    });

  });


  document.getElementById("logoutBtn").addEventListener("click", async () => {

    try {

      await signOut(auth);
      window.location.href = "login.html";

    } catch (error) {

      alert("Logout failed: " + error.message);

    }

  });

</script>

</body>
</html>

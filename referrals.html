<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexora | Referrals</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#07111f;
    color:#fff;
    min-height:100vh;
}

.sidebar{
    position:fixed;
    left:0;
    top:0;
    width:240px;
    height:100vh;
    padding:25px 15px;
    background:#0b1728;
    border-right:1px solid rgba(255,255,255,.08);
}

.logo{
    font-size:25px;
    font-weight:800;
    text-align:center;
    margin-bottom:35px;
}

.logo span{
    color:#00e5ff;
}

.nav a{
    display:block;
    color:#b9c5d6;
    text-decoration:none;
    padding:14px 16px;
    margin:7px 0;
    border-radius:12px;
    transition:.2s;
}

.nav a:hover,
.nav a.active{
    background:linear-gradient(135deg,#00c6ff,#7b2cff);
    color:#fff;
}

.main{
    margin-left:240px;
    padding:35px;
}

.topbar{
    margin-bottom:25px;
}

.topbar h1{
    font-size:30px;
}

.topbar p{
    color:#8fa1b8;
    margin-top:7px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
    margin-bottom:25px;
}

.card{
    background:linear-gradient(145deg,#0d1d32,#091525);
    border:1px solid rgba(255,255,255,.08);
    border-radius:18px;
    padding:22px;
    box-shadow:0 15px 35px rgba(0,0,0,.25);
}

.card small{
    color:#8fa1b8;
}

.card h2{
    margin-top:10px;
    font-size:27px;
}

.refbox{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
    margin-bottom:25px;
}

.inputbox{
    display:flex;
    gap:10px;
    margin-top:12px;
}

.inputbox input{
    width:100%;
    padding:14px;
    border-radius:10px;
    border:1px solid #263850;
    background:#07111f;
    color:#fff;
    outline:none;
}

button{
    border:0;
    border-radius:10px;
    padding:0 18px;
    cursor:pointer;
    color:#fff;
    font-weight:700;
    background:linear-gradient(135deg,#00c6ff,#7b2cff);
}

.table-card{
    overflow:hidden;
}

.table-wrap{
    overflow-x:auto;
    margin-top:18px;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:600px;
}

th,td{
    text-align:left;
    padding:15px;
    border-bottom:1px solid rgba(255,255,255,.07);
}

th{
    color:#8fa1b8;
    font-size:13px;
}

td{
    color:#dce5f0;
}

.status{
    display:inline-block;
    padding:6px 10px;
    border-radius:20px;
    background:rgba(0,230,118,.12);
    color:#00e676;
    font-size:12px;
}

.empty{
    text-align:center;
    padding:35px;
    color:#7f90a6;
}

@media(max-width:800px){
    .sidebar{
        position:relative;
        width:100%;
        height:auto;
    }

    .main{
        margin-left:0;
        padding:20px;
    }

    .stats,
    .refbox{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<aside class="sidebar">
    <div class="logo">NEX<span>ORA</span></div>

    <nav class="nav">
        <a href="dashboard.html">Dashboard</a>
        <a href="plans.html">Plans</a>
        <a href="deposit.html">Deposit</a>
        <a href="withdraw.html">Withdraw</a>
        <a href="referrals.html" class="active">Referrals</a>
        <a href="history.html">History</a>
        <a href="#" id="logoutBtn">Logout</a>
    </nav>
</aside>

<main class="main">

    <div class="topbar">
        <h1>Referral Center</h1>
        <p>Invite members and track your referrals.</p>
    </div>

    <section class="stats">

        <div class="card">
            <small>Direct Referrals</small>
            <h2 id="directReferrals">0</h2>
        </div>

        <div class="card">
            <small>Referral Earnings</small>
            <h2>$<span id="referralEarnings">0.00</span></h2>
        </div>

        <div class="card">
            <small>Commission</small>
            <h2>20%</h2>
        </div>

    </section>

    <section class="refbox">

        <div class="card">
            <small>Your Referral Code</small>

            <div class="inputbox">
                <input id="referralCode" readonly>
                <button id="copyCode">Copy</button>
            </div>
        </div>

        <div class="card">
            <small>Your Referral Link</small>

            <div class="inputbox">
                <input id="referralLink" readonly>
                <button id="copyLink">Copy</button>
            </div>
        </div>

    </section>

    <section class="card table-card">

        <h2>Your Referrals</h2>

        <div class="table-wrap">

            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Status</th>
                    </tr>
                </thead>

                <tbody id="referralList"></tbody>

            </table>

        </div>

    </section>

</main>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged,
    signOut
}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
    getDatabase,
    ref,
    get
}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";


const firebaseConfig = {
    apiKey: "AIzaSyBr-z5-7I8_WEy-XuQX8Z5dXa9XtCxXba0",
    authDomain: "nexora-adef3.firebaseapp.com",
    databaseURL: "https://nexora-adef3-default-rtdb.firebaseio.com",
    projectId: "nexora-adef3",
    storageBucket: "nexora-adef3.firebasestorage.app",
    messagingSenderId: "318277373899",
    appId: "1:318277373899:web:0d2f97b1fa99cc7702304e",
    measurementId: "G-WN2V48SC4T"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);


const codeInput = document.getElementById("referralCode");
const linkInput = document.getElementById("referralLink");
const list = document.getElementById("referralList");


function escapeHTML(value){
    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


onAuthStateChanged(auth, async (user) => {

    if(!user){
        window.location.href = "user-login.html";
        return;
    }

    try{

        const userSnap = await get(
            ref(db,"users/" + user.uid)
        );

        if(!userSnap.exists()){
            list.innerHTML = `
                <tr>
                    <td colspan="3" class="empty">
                        User data not found.
                    </td>
                </tr>
            `;
            return;
        }

        const currentUser = userSnap.val();

        const referralCode =
            String(currentUser.referralCode || "").trim();

        const earnings =
            Number(currentUser.referralEarnings || 0);

        const directCount =
            Number(currentUser.directReferrals || 0);


        document.getElementById("directReferrals").textContent =
            directCount;

        document.getElementById("referralEarnings").textContent =
            earnings.toFixed(2);

        codeInput.value = referralCode;


        /*
          IMPORTANT:
          Referral link ALWAYS points to register.html
        */

        const registerUrl =
            new URL("register.html", window.location.href);

        registerUrl.searchParams.set("ref", referralCode);

        linkInput.value = registerUrl.href;


        /*
          Load all users and find referrals
        */

        const usersSnap = await get(ref(db,"users"));

        if(!usersSnap.exists()){
            list.innerHTML = `
                <tr>
                    <td colspan="3" class="empty">
                        No referrals yet.
                    </td>
                </tr>
            `;
            return;
        }

        const users = usersSnap.val();

        const referrals = [];

        Object.values(users).forEach(u => {

            if(!u) return;

            const referredBy =
                String(u.referredBy || "")
                .trim()
                .toUpperCase();

            const referrerUid =
                String(u.referrerUid || "")
                .trim();

            const myCode =
                referralCode.toUpperCase();


            if(
                (referredBy && referredBy === myCode) ||
                (referrerUid && referrerUid === user.uid)
            ){
                referrals.push(u);
            }

        });


        if(referrals.length === 0){

            list.innerHTML = `
                <tr>
                    <td colspan="3" class="empty">
                        No referrals found yet.
                    </td>
                </tr>
            `;

            return;
        }


        list.innerHTML = referrals.map(u => `

            <tr>

                <td>
                    ${escapeHTML(u.name || "Member")}
                </td>

                <td>
                    ${escapeHTML(u.email || "-")}
                </td>

                <td>
                    <span class="status">Active</span>
                </td>

            </tr>

        `).join("");


        /*
          Keep displayed count synced with actual list
        */

        document.getElementById("directReferrals").textContent =
            referrals.length;

    }
    catch(error){

        console.error("Referral error:", error);

        list.innerHTML = `
            <tr>
                <td colspan="3" class="empty">
                    Unable to load referrals.
                </td>
            </tr>
        `;
    }

});


document.getElementById("copyCode").addEventListener("click", async () => {

    if(!codeInput.value) return;

    await navigator.clipboard.writeText(codeInput.value);

    alert("Referral code copied!");

});


document.getElementById("copyLink").addEventListener("click", async () => {

    if(!linkInput.value) return;

    await navigator.clipboard.writeText(linkInput.value);

    alert("Referral link copied!");

});


document.getElementById("logoutBtn").addEventListener("click", async (e) => {

    e.preventDefault();

    await signOut(auth);

    window.location.href = "user-login.html";

});

</script>

</body>
</html>
